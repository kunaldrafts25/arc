name: Combined source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy jinja2 pillow
      - working-directory: ARC-AGI-3-Kaggle-Starter
        run: python -m pytest -q tests/test_core.py tests/test_prediction_ledger.py tests/test_prediction_host.py tests/test_prediction_adoption.py tests/test_arc3_comparison.py tests/test_arc3_allocation_bound.py tests/test_arc3_teacher_alignment.py tests/test_release_audit.py tests/test_arc2.py tests/test_arc2_neural.py tests/test_arc2_adaptation.py tests/test_arc2_bounded_inference.py
